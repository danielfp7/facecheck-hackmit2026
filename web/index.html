<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Bank: sign in</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #14171f; --muted: #667085; --line: #e3e6ec;
    --accent: #2447d6; --green: #12805c; --green-bg: #e3f6ee; --red: #b42318; --red-bg: #fdeceA;
    --yellow: #9a6700; --yellow-bg: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --card: #171b22; --ink: #eef1f6; --muted: #98a2b3; --line: #2a303b;
      --accent: #7d9bff; --green: #4ad6a3; --green-bg: #10302a; --red: #ff8a7a; --red-bg: #3a1815;
      --yellow: #f2c14e; --yellow-bg: #362b0e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: transparent; color: var(--ink); font-size: 16px; margin-bottom: 16px; }
  button { width: 100%; padding: 13px; border: 0; border-radius: 10px; background: var(--accent);
    color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .55; cursor: default; }
  #status { margin-top: 20px; display: none; }
  .banner { border-radius: 12px; padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
  .banner h2 { margin: 0; font-size: 18px; }
  .banner p { margin: 2px 0 0; font-size: 14px; }
  .banner img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; }
  .pending { background: var(--yellow-bg); color: var(--yellow); }
  .verified { background: var(--green-bg); color: var(--green); }
  .failed { background: var(--red-bg); color: var(--red); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; border-left-width: 5px; }
  .tile.green { border-left-color: var(--green); } .tile.red { border-left-color: var(--red); }
  .tile.yellow { border-left-color: var(--yellow); }
  .tile .name { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile .headline { font-size: 18px; font-weight: 650; }
  .tile .detail { font-size: 12px; color: var(--muted); }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid currentColor;
    border-right-color: transparent; animation: spin .9s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>Demo Bank</h1>
  <p class="sub">Sign-in protected by InHuman: proves a live person is holding your phone.</p>
  <div class="card">
    <label for="user">Username</label>
    <input id="user" value="daniel" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" value="hunter2hunter2">
    <button id="go">Sign in</button>
    <div id="status"></div>
  </div>
  <p class="sub" style="margin-top:16px;font-size:14px">Approve on your iPhone, or on this computer with the <a href="/app/" target="_blank" rel="noopener">InHuman web app</a>.</p>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let timer = null;

function show(html) { const s = $("status"); s.style.display = "block"; s.innerHTML = html; }

function render(req) {
  if (req.status === "pending") {
    return show(`<div class="banner pending"><div class="spinner"></div><div>
      <h2>Check your phone</h2><p>Open InHuman and approve this sign-in.</p></div></div>`);
  }
  const r = req.result || {};
  const ok = r.verdict === "verified";
  const title = { verified: "Verified", unverified: "Not verified", unverifiable: "Couldn't verify", denied: "Denied" }[r.verdict] || r.verdict;
  const img = r.capture ? `<img src="/captures/${esc(r.capture)}/selfie.jpg" alt="" onerror="this.remove()">` : "";
  const tiles = (r.tiles || []).map(t => `<div class="tile ${esc(t.status)}"><div class="name">${esc(t.name)}</div>
    <div class="headline">${esc(t.headline)}</div><div class="detail">${esc(t.detail)}</div></div>`).join("");
  show(`<div class="banner ${ok ? "verified" : "failed"}">${img}<div><h2>${esc(title)}</h2><p>${esc(r.reason)}</p></div></div>
    <div class="tiles">${tiles}</div>`);
}

$("go").onclick = async () => {
  clearInterval(timer);
  $("go").disabled = true;
  const res = await fetch("/auth/requests", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user: $("user").value.trim(), app_name: "Demo Bank" }) });
  if (!res.ok) { show(`<div class="banner failed"><div><h2>Error</h2><p>${esc(await res.text())}</p></div></div>`); $("go").disabled = false; return; }
  let req = await res.json();
  render(req);
  timer = setInterval(async () => {
    req = await (await fetch(`/auth/requests/${req.id}`)).json();
    render(req);
    if (req.status !== "pending") { clearInterval(timer); $("go").disabled = false; $("go").textContent = "Sign in again"; }
  }, 1000);
};
</script>
</body>
</html>
